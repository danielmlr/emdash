name: Admin times (fork only)

on:
  push:
    branches: [ci-repro/admin-times]

permissions:
  contents: read

jobs:
  admin:
    name: Admin ${{ matrix.half }}/2 rep ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
        half: [1, 2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter "@emdash-cms/admin..." build
      - name: Name the Playwright browser cache
        id: playwright-key
        run: echo "key=playwright-shell-$ImageOS-$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-key.outputs.key }}
      - run: pnpm exec playwright install --only-shell chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Test admin UI
        id: admin
        run: pnpm run --filter @emdash-cms/admin test --shard=${{ matrix.half }}/2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.admin.outcome != 'skipped' }}
        with:
          name: vitest-timings-admin-r${{ matrix.rep }}-${{ matrix.half }}
          path: packages/admin/vitest-timings/
          retention-days: 7
