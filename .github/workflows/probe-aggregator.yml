name: Probe aggregator tests

on:
  push:
    branches: [probe/aggregator-offline]

permissions:
  contents: read

jobs:
  probe:
    name: aggregator ${{ matrix.variant }} (slow DNS for the tests only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [main, stub]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.variant == 'main'
        run: git checkout a6b28a6b1bf96f9ade9cc5c0327cd5b2e5af1ca2 -- apps/aggregator/vitest.config.ts
      - if: matrix.variant == 'stub'
        run: cp apps/aggregator/vitest.stub.config.ts apps/aggregator/vitest.config.ts
      - run: git diff --stat a6b28a6b1bf96f9ade9cc5c0327cd5b2e5af1ca2 -- apps/aggregator/vitest.config.ts
      - run: pnpm run --if-present --filter "@emdash-cms/aggregator..." build
      - name: Run backfill.test.ts with a resolver that takes 5 s per query and fails
        working-directory: apps/aggregator
        run: |
          printf 'nameserver 10.255.255.1\noptions timeout:5 attempts:1\n' > /tmp/slow-resolv.conf
          cat > /tmp/run-tests.sh <<EOF
          set -u
          export PATH="$PATH"
          export HOME=/home/runner
          cd "$PWD"
          grep '^hosts' /etc/nsswitch.conf
          start=\$(date +%s%N); getent hosts plc.directory || echo "lookup failed"; echo "plc.directory lookup took \$(( (\$(date +%s%N) - start) / 1000000 )) ms"
          start=\$(date +%s)
          timeout -k 10 480 ./node_modules/.bin/vitest run test/backfill.test.ts --reporter=verbose > file.log 2>&1
          echo "vitest exit=\$? after \$(( \$(date +%s) - start )) s"
          head -c 2500 file.log
          EOF
          sudo unshare -m bash -c 'mount --bind /tmp/slow-resolv.conf /etc/resolv.conf && exec setpriv --reuid=runner --regid=runner --init-groups bash /tmp/run-tests.sh'
          echo "outside the namespace:"; getent hosts github.com | head -1
      - name: Show the result
        if: always()
        working-directory: apps/aggregator
        run: grep -E "✓|×|→|Tests |Duration|timed out|Called close|did not resolve" file.log | cut -c1-180 | head -90 || true
