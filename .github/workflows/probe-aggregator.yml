name: Probe aggregator tests

on:
  push:
    branches: [probe/aggregator-offline]

permissions:
  contents: read

jobs:
  probe:
    name: aggregator ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.variant == 'before'
        run: git checkout HEAD~2 -- apps/aggregator/vitest.config.ts && git diff --stat HEAD
      - run: pnpm run --if-present --filter "@emdash-cms/aggregator..." build
      - name: Run the aggregator suite six times
        working-directory: apps/aggregator
        run: |
          for i in 1 2 3 4 5 6; do
            echo "::group::run $i"
            pnpm exec vitest run --reporter=verbose > run.log 2>&1 || true
            grep -E "(✓|×) .*(triggers discovery|canonical mixed|BEARER|valid token)|Tests  |Duration|discovery complete" run.log || true
            echo "::endgroup::"
            grep -E "(✓|×) .*(triggers discovery \(production|canonical mixed|uppercase BEARER)|Tests  " run.log | sed "s/^/run $i: /" || true
          done
