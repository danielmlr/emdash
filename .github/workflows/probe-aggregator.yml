name: Probe aggregator tests

on:
  push:
    branches: [probe/aggregator-offline]

permissions:
  contents: read

jobs:
  probe:
    name: aggregator ${{ matrix.variant }} (slow DNS)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [main, urls, stub]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.variant == 'main'
        run: git checkout a6b28a6b1bf96f9ade9cc5c0327cd5b2e5af1ca2 -- apps/aggregator/vitest.config.ts
      - if: matrix.variant == 'stub'
        run: cp apps/aggregator/vitest.stub.config.ts apps/aggregator/vitest.config.ts
      - run: git diff --stat a6b28a6b1bf96f9ade9cc5c0327cd5b2e5af1ca2 -- apps/aggregator/vitest.config.ts
      - run: pnpm run --if-present --filter "@emdash-cms/aggregator..." build
      - name: Make every DNS lookup take 5 s and fail
        run: |
          sudo systemctl stop systemd-resolved || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 10.255.255.1\noptions timeout:5 attempts:1\n' | sudo tee /etc/resolv.conf
          grep '^hosts' /etc/nsswitch.conf
          start=$(date +%s%N); getent hosts plc.directory || echo "lookup failed"; echo "plc.directory lookup took $(( ($(date +%s%N) - start) / 1000000 )) ms"
          getent hosts localhost
      - name: Run backfill.test.ts three times, then the whole suite
        working-directory: apps/aggregator
        run: |
          summarize='
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const tests = r.testResults.flatMap((f) => f.assertionResults);
            const pick = /triggers discovery \(production|canonical mixed|uppercase BEARER|returns 204 on POST with valid token/;
            const slow = tests.filter((t) => pick.test(t.title)).map((t) => `${Math.round(t.duration ?? 0)}ms ${t.status} ${t.title.slice(0, 40)}`);
            const failed = tests.filter((t) => t.status === "failed").map((t) => `${Math.round(t.duration ?? 0)}ms ${t.title}`);
            console.log(`${process.argv[2]}: passed=${r.numPassedTests} failed=${r.numFailedTests} | ${slow.join(" | ")}${failed.length ? " | FAILED: " + failed.join(", ") : ""}`);
          '
          for i in 1 2 3; do
            pnpm exec vitest run test/backfill.test.ts --reporter=json --outputFile=file-$i.json > file-$i.log 2>&1 || true
            node -e "$summarize" file-$i.json "backfill.test.ts run $i"
          done
          pnpm exec vitest run --reporter=json --outputFile=full.json > full.log 2>&1 || true
          node -e "$summarize" full.json "full suite"
          grep -h "Called close before connection\|did not resolve within" file-*.log full.log | sort | uniq -c || true
