name: Probe Firefox clipboard test

on:
  push:
    branches: [probe/firefox-clipboard, probe/firefox-clipboard-stack]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run --filter emdash... build
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Run the clipboard test 15 times in Firefox
        env:
          CI: "true"
        run: |
          set +e
          pnpm exec playwright test --config=playwright.table.config.ts --project=firefox --grep "clipboard" --repeat-each=15 --reporter=line > run.log 2>&1
          echo "exit=$?"
          grep -E "passed|failed|flaky" run.log | tail -5
          grep -o "Cannot update a component ([^)]*) while rendering a different component ([^)]*)" run.log | sort | uniq -c
          grep -o 'PROBE-NEST[^"]*' run.log | head -60
          grep -o 'PROBE-STACK[^"]*' run.log | head -20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-firefox-clipboard
          path: |
            run.log
            test-results/
          retention-days: 7
